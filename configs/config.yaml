# Provider configurations.
#
# t4_hf (default): loads Hugging Face models directly into the Inspect AI
# process and runs them on CUDA. This profile is sized for a single Tesla T4
# 16 GB instance (4 CPU, 16 GB RAM).
#
#   inspect eval experiments/medical_mcq_robustness_eval.py@medical_mcq_robustness \
#     -T policy=baseline --limit 20 --log-dir logs
#
# ollama: requires `ollama serve` running locally
#   ollama pull qwen2.5:7b
#   inspect eval ... --model ollama/qwen2.5:7b
#
# openrouter: set env vars before running
#   export OPENAI_BASE_URL=https://openrouter.ai/api/v1
#   export OPENAI_API_KEY=$OPENROUTER_API_KEY
#   export OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
#   inspect eval ... --model openai-api/openrouter/qwen/qwen3-1.7b

provider:
  default: t4_hf

  t4_hf:
    models:
      qwen3-1.7b: hf/Qwen/Qwen3-1.7B
      gemma-3-4b-it: hf/google/gemma-3-4b-it
      olmo2-0425-1b-instruct: hf/allenai/OLMo-2-0425-1B-Instruct
      qwen3-guard-0.6b: hf/Qwen/Qwen3Guard-Gen-0.6B

  ollama:
    base_url: http://localhost:11434
    models:
      qwen3-1.7b: ollama/qwen3:1.7b
      gemma-3-4b-it: ollama/gemma3:4b

  openrouter:
    base_url: https://openrouter.ai/api/v1
    env_key: OPENROUTER_API_KEY
    models:
      gemini-2.5-pro: openai-api/openrouter/google/gemini-2.5-pro
      gpt-oss-120b: openai-api/openrouter/openai/gpt-oss-120b
      qwen3-1.7b: openai-api/openrouter/qwen/qwen3-1.7b
      qwen3-32b: openai-api/openrouter/qwen/qwen3-32b
      qwen-2.5-72b-instruct: openai-api/openrouter/qwen/qwen-2.5-72b-instruct

# Runtime profile used by experiment tasks when --model is not provided.
# The default profile keeps both the main LLM and Qwen3Guard on the same T4.
# Increase max_connections/batch_size only after checking nvidia-smi.

runtime:
  default: t4_hf

  t4_hf:
    provider: t4_hf
    judge_provider: openrouter
    main_model: qwen3-1.7b
    guard_model: qwen3-guard-0.6b
    judge_model: qwen3-32b

    model_args:
      device: cuda:0
      dtype: float16
      trust_remote_code: true
      do_sample: false
      batch_size: 4
      enable_thinking: false

    guard_model_args:
      batch_size: 4
      enable_thinking: false

    generate:
      max_connections: 4
      temperature: 0.0
      top_p: 1.0
      seed: 42

    guard:
      max_tokens: 128
      temperature: 0.0

  t4_hf_qwen3_1_7b_openrouter_judge:
