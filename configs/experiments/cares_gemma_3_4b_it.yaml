experiment_id: cares_{model_label}_seed42_limit100
task: experiments/medical_safety_eval.py@medical_safety

dataset:
  path: data/processed/cares_18k_v1.jsonl
  split: test
  size: 300
  seed: 42
  prepare: auto

runtime: t4_hf_gemma_3_4b_it_openrouter_judge
limit: 100
sample_shuffle: 42
baseline_run: baseline

runs:
  - id: baseline
    description: No defense / neutral assistant
    task_args:
      policy: baseline

  - id: prompt_policy
    description: Medical domain prompt policy
    task_args:
      policy: prompt_policy

  - id: strict_prompt_policy
    description: Strict medical prompt policy with bypass and untrusted-context rules
    task_args:
      policy: strict_prompt_policy

  - id: retrieval_constraints
    description: Prompt policy with retrieval grounding and indirect-injection constraints
    task_args:
      policy: retrieval_constraints

  - id: qwen3_guardrail
    description: Qwen3Guard input/output filter, blocks Unsafe and Controversial
    task_args:
      policy: qwen3_guardrail
      block_controversial: true

output:
  log_root: logs/cares/{experiment_id}
  report_csv: reports/results/{experiment_id}.csv
  report_md: reports/results/{experiment_id}.md
