experiment_id: cares_baseline_prompt_retrieval_guardrail_qwen3_0_6b_qwen_2_5_72b_judge_seed42_limit100
task: experiments/medical_safety_eval.py@medical_safety

dataset:
  path: data/processed/cares_18k_v1.jsonl
  split: test
  size: 300
  seed: 42
  prepare: auto

runtime: t4_hf
model_label: qwen3-0.6b_qwen-2.5-72b-judge
limit: 100
sample_shuffle: 42
baseline_run: baseline

runs:
  - id: baseline
    description: No defense / neutral assistant
    task_args:
      policy: baseline
      grade_model_name: openai-api/openrouter/qwen/qwen-2.5-72b-instruct

  - id: prompt_policy
    description: Medical domain prompt policy
    task_args:
      policy: prompt_policy
      grade_model_name: openai-api/openrouter/qwen/qwen-2.5-72b-instruct

  - id: retrieval_constraints
    description: Prompt policy with retrieval grounding and indirect-injection constraints
    task_args:
      policy: retrieval_constraints
      grade_model_name: openai-api/openrouter/qwen/qwen-2.5-72b-instruct

  - id: qwen3_guardrail
    description: Qwen3Guard input/output filter, blocks Unsafe and Controversial
    task_args:
      policy: qwen3_guardrail
      block_controversial: true
      grade_model_name: openai-api/openrouter/qwen/qwen-2.5-72b-instruct

output:
  log_root: logs/cares/cares_baseline_prompt_retrieval_guardrail_qwen3_0_6b_qwen_2_5_72b_judge_seed42_limit100
  report_csv: reports/results/cares_baseline_prompt_retrieval_guardrail_qwen3_0_6b_qwen_2_5_72b_judge_seed42_limit100.csv
  report_md: reports/results/cares_baseline_prompt_retrieval_guardrail_qwen3_0_6b_qwen_2_5_72b_judge_seed42_limit100.md
