experiment_id: cares_qwen3_0_6b_seed42_limit100
task: experiments/medical_safety_eval.py@medical_safety

dataset:
  path: data/processed/cares_18k_v1.jsonl
  split: test
  size: 300
  seed: 42
  prepare: auto

runtime: t4_hf
model_label: qwen3-0.6b
limit: 100
sample_shuffle: 42
baseline_run: baseline

runs:
  - id: baseline
    description: No defense / neutral assistant
    task_args:
      policy: baseline

  - id: prompt_policy
    description: Medical domain prompt policy
    task_args:
      policy: prompt_policy

  - id: guardrail_style
    description: Prompt policy with internal safety classification
    task_args:
      policy: guardrail_style

  - id: qwen3_guardrail
    description: Qwen3Guard input/output filter, blocks Unsafe and Controversial
    task_args:
      policy: qwen3_guardrail
      block_controversial: true

output:
  log_root: logs/cares/cares_qwen3_0_6b_seed42_limit100
  report_csv: reports/results/cares_qwen3_0_6b_seed42_limit100.csv
  report_md: reports/results/cares_qwen3_0_6b_seed42_limit100.md
